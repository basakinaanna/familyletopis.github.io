<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейная Летопись</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
body { background: #f8f4eb; color: #3f2a1e; }
.title { font-family:'Great Vibes',cursive; font-size:5rem; color:#3f2a1e; text-align:center; margin:10px 0 20px; letter-spacing:6px; text-shadow:3px 3px 8px rgba(0,0,0,0.1); }
.person-card { transition:all 0.3s; cursor:pointer; background:#fffaf0; }
.person-card:hover { transform:translateY(-5px); box-shadow:0 15px 25px -5px rgb(139 69 19 / 0.3); }
.photo-card:hover { transform:scale(1.04); box-shadow:0 10px 25px rgba(0,0,0,0.15); }
.tab-button { color:#6b5c4a; }
.tab-button.active { color:#3f2a1e; }
.photo-sort-btn, .photo-filter-btn {
  padding: 6px 14px; border-radius: 14px;
  background: #f0e6d2; color: #6b5c4a;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  border: 1px solid #d4b89e; transition: all 0.15s;
}
.photo-sort-btn:hover, .photo-filter-btn:hover { background: #e8d9bf; color: #3f2a1e; }
.photo-sort-btn.active, .photo-filter-btn.active { background: #8d5524; color: #fff; border-color: #8d5524; }
.photo-kind-badge {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 0.75rem; font-weight: 700;
  background: #f0e6d2; color: #6b5c4a; margin-bottom: 6px;
}
.back-btn {
  display:inline-flex; align-items:center; gap:6px;
  background:#6b5c4a; color:#fff; padding:8px 18px;
  border-radius:14px; font-weight:700; font-size:0.9rem;
  cursor:pointer; border:none;
}
.back-btn:hover { background:#4e4136; }

.tree-viewport {
  position: relative; overflow: hidden;
  background: #fffaf0; border-radius: 20px;
  border: 1px solid #f0e6d2;
  cursor: grab; user-select: none; -webkit-user-select: none;
  touch-action: none;
}
.tree-viewport.dragging { cursor: grabbing; }
.tree-canvas {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  width: max-content;
  padding: 20px;
}
.zoom-controls {
  position: absolute; right: 14px; bottom: 14px;
  display: flex; gap: 4px; z-index: 5;
  background: rgba(255,250,240,0.96);
  padding: 5px; border-radius: 12px;
  border: 1px solid #d4b89e;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}
.zoom-controls button {
  width: 34px; height: 34px; border-radius: 8px;
  background: #f0e6d2; color: #6b5c4a;
  border: 1px solid #d4b89e;
  font-weight: 700; font-size: 16px;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.zoom-controls button:hover { background: #e8d9bf; color: #3f2a1e; }
.zoom-controls .zoom-level {
  padding: 0 8px; font-size: 0.8rem; font-weight: 700;
  color: #6b5c4a; display: inline-flex; align-items: center;
  min-width: 46px; justify-content: center;
}
.tree-help {
  position: absolute; left: 14px; bottom: 14px;
  font-size: 0.72rem; color: #8a7a68;
  background: rgba(255,250,240,0.9);
  padding: 4px 10px; border-radius: 10px;
  border: 1px solid #f0e6d2;
  z-index: 5; pointer-events: none;
}

.tree { display: inline-block; text-align: center; }
.tree, .tree ul { margin: 0; padding: 0; list-style: none; }
.tree ul { display: flex; justify-content: center; padding-top: 28px; position: relative; }
.tree li { display: flex; flex-direction: column; align-items: center; position: relative; padding: 28px 8px 0; list-style: none; }
.tree li::before, .tree li::after {
  content: ''; position: absolute; top: 0; right: 50%;
  border-top: 2px solid #8d5524; width: 50%; height: 28px;
}
.tree li::after { right: auto; left: 50%; border-left: 2px solid #8d5524; }
.tree li:only-child::after, .tree li:only-child::before { display: none; }
.tree li:only-child { padding-top: 0; }
.tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
.tree li:last-child::before { border-right: 2px solid #8d5524; border-radius: 0 6px 0 0; }
.tree li:first-child::after { border-radius: 6px 0 0 0; }
.tree ul ul::before {
  content: ''; position: absolute; top: 0; left: 50%;
  border-left: 2px solid #8d5524; width: 0; height: 28px;
}

.node-wrapper {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.tree-node {
  display: inline-flex; flex-direction: column; align-items: center;
  background: #ffffff;
  border: 2px solid #8d5524; border-radius: 16px;
  padding: 10px 12px; cursor: pointer;
  transition: all 0.2s;
  min-width: 120px; max-width: 210px;
  text-align: center;
  position: relative; z-index: 1;
  box-shadow: 0 4px 10px rgba(139,69,19,0.08);
}
.tree-node:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 20px -6px rgb(139 69 19 / 0.35);
}
.tree-node.is-main { border-width: 3px; }
.tree-node.is-spouse {
  border-style: dashed;
  min-width: 100px; max-width: 180px;
  padding: 8px 10px;
}

.node-photo {
  width: 64px; height: 64px;
  border-radius: 12px;
  object-fit: cover;
  margin: 0 auto 6px;
  display: block;
  border: 2px solid #e6d3b3;
  background: #f5e8d3;
}
.node-photo-emoji {
  font-size: 2.2rem;
  line-height: 64px;
  text-align: center;
  margin: 0 auto 6px;
  width: 64px; height: 64px;
  border-radius: 12px;
  border: 2px solid #e6d3b3;
  background: #f5e8d3;
  display: block;
}
.node-name { font-weight: 700; font-size: 0.86rem; color: #3f2a1e; line-height: 1.2; }
.node-years { font-size: 0.66rem; color: #5c4033; margin-top: 2px; opacity: 0.85; }

.couple-link {
  width: 22px;
  height: 2px;
  background: #c0392b;
  position: relative;
  align-self: center;
}
.couple-link::after {
  content: '💍';
  position: absolute;
  top: -10px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  background: #fffaf0;
  padding: 0 2px;
}

.pair-children {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  padding-top: 28px;
}
.pair-children::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  border-left: 2px solid #8d5524;
  height: 28px;
}
.pair-children > ul { padding-top: 0; }

.list-photo {
  width: 60px; height: 60px;
  border-radius: 14px;
  object-fit: cover;
  border: 2px solid #d4b89e;
  background: #f5e8d3;
  flex-shrink: 0;
}
.list-photo-emoji {
  width: 60px; height: 60px;
  border-radius: 14px;
  border: 2px solid #d4b89e;
  background: #f5e8d3;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  flex-shrink: 0;
}

/* Единая плоская цветовая гамма — без градиентов, все карточки одного цвета */
.palette-0, .palette-1, .palette-2, .palette-3,
.palette-4, .palette-5, .palette-6 {
  background: #fff8ec;
  border-color: #8d5524;
}
</style>
</head>
<body>

<div id="backBar" class="max-w-6xl mx-auto px-6 pt-6 hidden">
  <button class="back-btn" onclick="location.hash=''">← Вернуться к общей семье</button>
</div>

<h1 class="title" id="mainTitle">Семейная Летопись</h1>

<div class="max-w-6xl mx-auto px-6" id="tabsWrapper">
  <div class="flex flex-wrap gap-2 mb-8 border-b border-[#d4b89e] pb-2" id="tabsBar">
    <button onclick="showTab('main')" class="tab-button active px-6 py-3 font-bold border-b-4 border-[#8d5524]" id="tab-main">👨‍👩‍👧 Наша Семья</button>
    <button onclick="showTab('list')" class="tab-button px-6 py-3 font-bold" id="tab-list">📋 Все люди</button>
    <button onclick="showTab('photos')" class="tab-button px-6 py-3 font-bold" id="tab-photos">📸 Семейные фото</button>
    <button onclick="exportTree()" class="ml-auto bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-2.5 rounded-2xl font-bold">💾 Сохранить дерево</button>
  </div>
</div>

<div class="max-w-6xl mx-auto px-6" id="contentContainer">
  <div id="content-main" class="bg-white rounded-3xl shadow-2xl p-8">
    <div id="treeContainer"></div>
  </div>
  <div id="content-list" class="hidden bg-white rounded-3xl shadow-2xl p-8">
    <div class="flex justify-between mb-6">
      <input type="text" id="search" placeholder="Поиск по имени..." class="flex-1 p-4 rounded-2xl border border-[#d4b89e]" onkeyup="filterList()">
      <button onclick="addNewPerson()" class="ml-2 bg-[#8d5524] text-white px-6 rounded-2xl font-bold">+ Человека</button>
    </div>
    <div id="peopleList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>
  <div id="content-photos" class="hidden bg-white rounded-3xl shadow-2xl p-8">
    <h3 class="text-3xl font-bold mb-6 text-center">Семейные фотографии</h3>
    <button onclick="uploadFamilyPhoto()"
      class="mb-8 bg-[#8d5524] text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-2 mx-auto">
      <i class="fas fa-upload"></i> Загрузить фото / документ / медаль
    </button>
    <div class="flex flex-wrap justify-center gap-2 mb-4">
      <span class="text-sm font-bold self-center mr-2 text-[#6b5c4a]">Сортировка:</span>
      <button onclick="setPhotoSort('none')"  id="sortBtn-none"  class="photo-sort-btn">Без сортировки</button>
      <button onclick="setPhotoSort('date')"  id="sortBtn-date"  class="photo-sort-btn">📅 По дате</button>
      <button onclick="setPhotoSort('event')" id="sortBtn-event" class="photo-sort-btn">🎉 По событию</button>
      <button onclick="setPhotoSort('kind')"  id="sortBtn-kind"  class="photo-sort-btn">🏷 По виду</button>
    </div>
    <div class="flex flex-wrap justify-center gap-2 mb-8">
      <span class="text-sm font-bold self-center mr-2 text-[#6b5c4a]">Фильтр:</span>
      <button onclick="setPhotoFilter('all')"      id="filterBtn-all"      class="photo-filter-btn">Все</button>
      <button onclick="setPhotoFilter('Фото')"     id="filterBtn-Фото"     class="photo-filter-btn">📷 Фото</button>
      <button onclick="setPhotoFilter('Документ')" id="filterBtn-Документ" class="photo-filter-btn">📄 Документы</button>
      <button onclick="setPhotoFilter('Медаль')"   id="filterBtn-Медаль"   class="photo-filter-btn">🎖 Медали</button>
      <button onclick="setPhotoFilter('Другое')"   id="filterBtn-Другое"   class="photo-filter-btn">📦 Другое</button>
    </div>
    <div id="photoGallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-white rounded-3xl max-w-lg w-full mx-4 shadow-2xl overflow-hidden">
    <div class="bg-[#5c4033] text-white p-6 flex justify-between items-center">
      <h3 id="modalName" class="text-2xl font-bold"></h3>
      <button onclick="closeModal()" class="text-4xl leading-none">×</button>
    </div>
    <div class="p-8">
      <div class="relative w-52 h-52 mx-auto mb-6">
        <div id="modalPhoto" class="w-52 h-52 rounded-3xl flex items-center justify-center text-8xl border-8 border-[#f5e8d3] overflow-hidden bg-gray-100"></div>
        <button onclick="document.getElementById('photoUpload').click()" class="absolute bottom-3 right-3 bg-white text-[#5c4033] px-5 py-2 rounded-2xl text-sm shadow">📷 Загрузить</button>
        <input type="file" id="photoUpload" accept="image/*" class="hidden" onchange="uploadPersonPhoto(event)">
      </div>
      <div id="modalInfo" class="space-y-4"></div>
    </div>
    <div class="p-6 border-t grid grid-cols-3 gap-3">
      <button onclick="editCurrentPerson()" class="bg-[#8d5524] text-white py-4 rounded-2xl font-bold">✏️</button>
      <button onclick="addChildToCurrent()" class="bg-green-700 text-white py-4 rounded-2xl font-bold">➕ Ребёнка</button>
      <button onclick="addPartnerToCurrent()" class="bg-violet-700 text-white py-4 rounded-2xl font-bold">💑 Партнёра</button>
      <button onclick="addRelativeToCurrent()" class="col-span-3 bg-[#6b5c4a] text-white py-3 rounded-2xl font-bold">➕ Добавить родственника</button>
      <button onclick="changeRelationStatus()" class="col-span-3 bg-amber-600 text-white py-3 rounded-2xl font-bold">Изменить статус связи</button>
      <button onclick="deleteCurrentPerson()" class="bg-red-700 text-white py-4 rounded-2xl font-bold">🗑 Удалить</button>
      <button onclick="openSpouseCard()" id="spouseBtn" class="col-span-3 bg-teal-700 text-white py-3 rounded-2xl font-bold">👥 Открыть супруга/партнёра</button>
      <button onclick="openOwnFamilyTree()" id="ownTreeBtn" class="col-span-3 bg-indigo-700 text-white py-3 rounded-2xl font-bold hidden">🌳 Открыть древо</button>
      <button onclick="closeModal()" class="col-span-3 bg-gray-200 py-3 rounded-2xl font-bold">Закрыть</button>
    </div>
  </div>
</div>

/* ================== БАЗА ================== */
function getPerson(id) { return family.find(p => p.id === id); }
function getSpouses(person) {
  if (!person || !Array.isArray(person.spouseIds)) return [];
  return person.spouseIds.map(getPerson).filter(Boolean);
}
function isPartner(person) { return person && /партн|мужчин/i.test(person.relationType || ""); }
function canHavePersonalTree(person) { return person && person.side === "spouse"; }

function migrate() {
  family.forEach(p => {
    if (!Array.isArray(p.spouseIds)) p.spouseIds = [];
    p.spouseIds = [...new Set(p.spouseIds)];
    if (!('parentId2' in p)) p.parentId2 = null;
    if (!('side' in p)) p.side = "main";
    if (typeof p.palette !== "number") p.palette = 1;
  });
  family.forEach(p => {
    p.spouseIds.forEach(sid => {
      const s = getPerson(sid);
      if (s && !Array.isArray(s.spouseIds)) s.spouseIds = [];
      if (s && !s.spouseIds.includes(p.id)) s.spouseIds.push(p.id);
    });
  });
  if (!personalTreePhotos || typeof personalTreePhotos !== 'object') personalTreePhotos = {};
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      family, familyPhotos, personalTreePhotos,
      currentPhotoSort, currentPhotoFilter
    }));
  } catch(e) { console.warn(e); }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (Array.isArray(d.family) && d.family.length) {
      family = d.family;
      familyPhotos = Array.isArray(d.familyPhotos) ? d.familyPhotos : [];
      personalTreePhotos = (d.personalTreePhotos && typeof d.personalTreePhotos === 'object') ? d.personalTreePhotos : {};
      if (d.currentPhotoSort) currentPhotoSort = d.currentPhotoSort;
      if (d.currentPhotoFilter) currentPhotoFilter = d.currentPhotoFilter;
      migrate();
      return true;
    }
  } catch(e) { console.warn(e); }
  return false;
}

/* ================== ДЕРЕВО ==================
   buildChildrenMap учитывает ОБА родителя (parentId и parentId2),
   чтобы дети от второго брака корректно отображались под своим родителем.
*/
function buildChildrenMap(members) {
  const ids = new Set(members.map(m => m.id));
  const map = new Map();
  members.forEach(m => map.set(m.id, []));
  members.forEach(p => {
    const parents = [];
    if (p.parentId !== null && p.parentId !== undefined && ids.has(p.parentId)) parents.push(p.parentId);
    if (p.parentId2 !== null && p.parentId2 !== undefined && ids.has(p.parentId2)) parents.push(p.parentId2);
    if (parents.length === 0) return;
    // Прикрепляем к первому присутствующему родителю, чтобы не было дублей
    const primary = parents[0];
    map.get(primary).push(p);
  });
  return map;
}
function findRoots(members) {
  const ids = new Set(members.map(m => m.id));
  return members.filter(p => {
    const hasParent1 = p.parentId !== null && p.parentId !== undefined && ids.has(p.parentId);
    const hasParent2 = p.parentId2 !== null && p.parentId2 !== undefined && ids.has(p.parentId2);
    return !hasParent1 && !hasParent2;
  });
}
function groupChildrenBySecondParent(children) {
  const groups = new Map();
  children.forEach(ch => {
    const key = ch.parentId2 !== null && ch.parentId2 !== undefined ? ch.parentId2 : "__none__";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ch);
  });
  return groups;
}

function renderTree() {
  const container = document.getElementById("treeContainer");
  container.innerHTML = "";

  const members = family.filter(p => p.side === "main");
  if (members.length === 0) {
    container.innerHTML = `<p class="text-center text-gray-500">Нет данных</p>`;
    return;
  }
  const roots = findRoots(members);
  const childrenMap = buildChildrenMap(members);
  const rendered = new Set();

  const { vp, canvas } = createTreeViewport();
  const treeDiv = document.createElement("div");
  treeDiv.className = "tree";
  const rootUl = document.createElement("ul");
  roots.forEach(root => {
    if (rendered.has(root.id)) return;
    renderPersonBranch(root, rootUl, childrenMap, rendered);
  });
  treeDiv.appendChild(rootUl);
  canvas.appendChild(treeDiv);
  container.appendChild(vp);
  fitTreeView();
}

function renderPersonBranch(person, parentUl, childrenMap, rendered) {
  if (rendered.has(person.id)) return;
  rendered.add(person.id);

  const li = document.createElement("li");
  const wrapper = document.createElement("div");
  wrapper.className = "node-wrapper";

  const spouses = getSpouses(person);
  const palette = person.palette || 1;

  if (spouses.length === 0) {
    wrapper.appendChild(makeNode(person, true, palette));
  } else if (spouses.length === 1) {
    wrapper.appendChild(makeNode(person, true, palette));
    wrapper.appendChild(makeCoupleLink());
    wrapper.appendChild(makeNode(spouses[0], false, palette));
  } else {
    wrapper.appendChild(makeNode(spouses[0], false, palette));
    wrapper.appendChild(makeCoupleLink());
    wrapper.appendChild(makeNode(person, true, palette));
    for (let i = 1; i < spouses.length; i++) {
      wrapper.appendChild(makeCoupleLink());
      wrapper.appendChild(makeNode(spouses[i], false, palette));
    }
  }
  li.appendChild(wrapper);

  const children = (childrenMap.get(person.id) || []).filter(ch => !rendered.has(ch.id));
  if (children.length > 0) {
    const groups = groupChildrenBySecondParent(children);
    if (groups.size === 1) {
      const ul = document.createElement("ul");
      [...groups.values()][0].forEach(ch => renderPersonBranch(ch, ul, childrenMap, rendered));
      li.appendChild(ul);
    } else {
      const pairWrap = document.createElement("div");
      pairWrap.style.display = "flex";
      pairWrap.style.justifyContent = "center";
      pairWrap.style.alignItems = "flex-start";
      pairWrap.style.gap = "20px";
      pairWrap.style.paddingTop = "28px";
      pairWrap.style.position = "relative";
      const stem = document.createElement("div");
      stem.style.position = "absolute";
      stem.style.top = "0"; stem.style.left = "50%";
      stem.style.borderLeft = "2px solid #8d5524";
      stem.style.height = "28px";
      pairWrap.appendChild(stem);
      groups.forEach(kids => {
        const col = document.createElement("div");
        col.className = "pair-children";
        const ul = document.createElement("ul");
        ul.style.paddingTop = "0";
        kids.forEach(ch => renderPersonBranch(ch, ul, childrenMap, rendered));
        col.appendChild(ul);
        pairWrap.appendChild(col);
      });
      li.appendChild(pairWrap);
    }
  }
  parentUl.appendChild(li);
}

function makeNode(person, isMain, palette) {
  const div = document.createElement("div");
  const pal = typeof palette === "number" ? palette : (person.palette || 1);
  div.className = "tree-node palette-" + pal + " " + (isMain ? "is-main" : "is-spouse");
  div.onclick = (e) => { e.stopPropagation(); showPerson(person.id); };

  const photoHtml = person.photoData
    ? `<img src="${person.photoData}" class="node-photo" alt="${person.name}">`
    : `<div class="node-photo-emoji">${person.photo || '👤'}</div>`;

  div.innerHTML = `
    ${photoHtml}
    <div class="node-name">${person.name}</div>
    ${person.years ? `<div class="node-years">${person.years}</div>` : ''}
  `;
  return div;
}

function makeCoupleLink() {
  const link = document.createElement("div");
  link.className = "couple-link";
  return link;
}

/* ================== ДРЕВО ДОБАВОЧНОГО СУПРУГА ==================
   Включаем:
     - владельца,
     - всех его супругов/партнёров,
     - ВСЕХ потомков любого из них (включая детей от других браков),
     - супругов этих потомков.
*/
function getPersonalTreeMembers(ownerId) {
  const owner = getPerson(ownerId);
  if (!owner) return [];

  const included = new Set();
  const queue = [];

  included.add(owner.id);
  queue.push(owner.id);

  const ownerSpouses = getSpouses(owner);
  ownerSpouses.forEach(s => {
    if (!included.has(s.id)) { included.add(s.id); queue.push(s.id); }
  });

  const queued = new Set(queue);
  while (queue.length > 0) {
    const pid = queue.shift();
    family.forEach(ch => {
      if (ch.parentId !== pid && ch.parentId2 !== pid) return;
      if (included.has(ch.id)) return;
      included.add(ch.id);
      if (!queued.has(ch.id)) { queued.add(ch.id); queue.push(ch.id); }
      getSpouses(ch).forEach(sp => {
        if (!included.has(sp.id)) {
          included.add(sp.id);
          if (!queued.has(sp.id)) { queued.add(sp.id); queue.push(sp.id); }
        }
      });
    });
  }

  return [...included].map(getPerson).filter(Boolean);
}

function goToPersonalTree(ownerId) { location.hash = 'tree_' + ownerId; }

function renderPersonalTree(ownerId) {
  const tw = document.getElementById("tabsWrapper");
  if (tw) tw.classList.add("hidden");
  const lc = document.getElementById("content-list"); if (lc) lc.classList.add("hidden");
  const pc = document.getElementById("content-photos"); if (pc) pc.classList.add("hidden");
  const mc = document.getElementById("content-main"); if (mc) mc.classList.remove("hidden");
  const bb = document.getElementById("backBar"); if (bb) bb.classList.remove("hidden");

  const owner = getPerson(ownerId);
  const title = document.getElementById("mainTitle");
  if (title) title.textContent = owner ? "Древо: " + owner.name : "Древо";

  const container = document.getElementById("treeContainer");
  container.innerHTML = "";

  const members = getPersonalTreeMembers(ownerId);
  const childrenMap = buildChildrenMap(members);
  const rendered = new Set();

  const { vp, canvas } = createTreeViewport();
  const treeDiv = document.createElement("div");
  treeDiv.className = "tree";
  const rootUl = document.createElement("ul");
  if (owner) renderPersonBranch(owner, rootUl, childrenMap, rendered);
  treeDiv.appendChild(rootUl);
  canvas.appendChild(treeDiv);

  const galleryWrap = document.createElement("div");
  galleryWrap.className = "mt-6 flex justify-center";
  galleryWrap.innerHTML = `<button onclick="openPersonalTreeGallery(${ownerId})"
      class="bg-teal-700 hover:bg-teal-800 text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-2">
      📸 Галерея древа
    </button>`;
  container.appendChild(vp);
  container.appendChild(galleryWrap);
  fitTreeView();
}

/* ================== МОДАЛКА ЧЕЛОВЕКА ================== */
function showPerson(id) {
  currentEditId = id;
  const p = getPerson(id);
  if (!p) return;
  const spouses = getSpouses(p);

  document.getElementById("modalName").textContent = p.name;
  const photoDiv = document.getElementById("modalPhoto");
  photoDiv.innerHTML = p.photoData
    ? `<img src="${p.photoData}" class="w-full h-full object-cover rounded-3xl">`
    : `<span class="text-8xl">${p.photo || '👤'}</span>`;
  const spouseList = spouses.length
    ? spouses.map(s => `<a onclick="closeModal(); setTimeout(()=>showPerson(${s.id}),200)" class="spouse-link">${s.name}${isPartner(s) ? ' 💑' : ' 💍'}</a>`).join(', ')
    : '';
  document.getElementById("modalInfo").innerHTML = `
    <p><strong>Годы жизни:</strong> ${p.years || '—'}</p>
    <p><strong>Биография:</strong> ${p.info || '—'}</p>
    <p><strong>Статус связи:</strong> ${p.relationType || '—'}</p>
    ${spouseList ? `<p class="pt-4 border-t"><strong>Супруг(и)/партнёр(ы):</strong> ${spouseList}</p>` : ''}
  `;
  document.getElementById("spouseBtn").classList.toggle("hidden", spouses.length === 0);

  const ownTreeBtn = document.getElementById("ownTreeBtn");
  const alreadyHere = (viewMode === "personal" && currentOwnerId === id);

function addRelativeToCurrent() {
  const person = getPerson(currentEditId);
  const who = prompt(`Кем приходится новый человек для «${person.name}»?\n(сын, дочь, муж, жена, партнёр, отец, мать, брат, сестра)`, "сын");

  const name = prompt("Имя нового родственника:");
  if (!name) return;
  const years = prompt("Годы жизни:", "");
  const gender = (prompt("Пол (м/ж):", "м") || "м").toLowerCase();
  const photo = gender.startsWith("ж") ? "👩" : "👨";

  const maxId = Math.max(...family.map(x => x.id)) + 1;
  const parentPalette = typeof person.palette === "number" ? person.palette : 1;
  const newPerson = {
    id: maxId, name, years: years || "", info: who + " " + person.name, photo, photoData: "",
    parentId: null, parentId2: null, spouseIds: [],
    side: "main", relationType: who, familyGroup: "main", palette: parentPalette
  };

  const w = who.toLowerCase();
  if (w.includes("сын") || w.includes("дочь") || w.includes("ребен") || w.includes("ребён")) {
    newPerson.parentId = person.id;
    const spouses = getSpouses(person);
    if (spouses.length === 1) newPerson.parentId2 = spouses[0].id;
  } else if (w.includes("муж") || w.includes("жен") || w.includes("супруг") || w.includes("партн")) {
    person.spouseIds.push(maxId);
    newPerson.spouseIds = [person.id];
    newPerson.side = "spouse";
  } else if (w.includes("брат") || w.includes("сестр")) {
    newPerson.parentId = person.parentId;
    newPerson.parentId2 = person.parentId2;
  } else if (w.includes("отец") || w.includes("мать") || w.includes("родител")) {
    if (!person.parentId) person.parentId = maxId;
    else if (!person.parentId2) person.parentId2 = maxId;
  }
  family.push(newPerson);
  closeModal();
  renderAll();
}

/* ================== ПАНОРАМА / ЗУМ ================== */
function createTreeViewport() {
  const vp = document.createElement("div");
  vp.className = "tree-viewport";
  vp.id = "treeViewport";
  const canvas = document.createElement("div");
  canvas.className = "tree-canvas";
  canvas.id = "treeCanvas";
  const controls = document.createElement("div");
  controls.className = "zoom-controls";
  controls.onmousedown = (e) => e.stopPropagation();
  controls.ontouchstart = (e) => e.stopPropagation();
  controls.innerHTML = `
    <button type="button" onclick="zoomTree(0.85)" title="Уменьшить">−</button>
    <span class="zoom-level" id="zoomLevel">100%</span>
    <button type="button" onclick="zoomTree(1.15)" title="Увеличить">+</button>
    <button type="button" onclick="resetTreeView()" title="Сбросить вид">⌂</button>
  `;
  const help = document.createElement("div");
  help.className = "tree-help";
  help.textContent = "🖱 колесо — зум · перетаскивание — сдвиг";
  vp.appendChild(canvas);
  vp.appendChild(controls);
  vp.appendChild(help);
  vp.addEventListener("mousedown", onDragStart);
  window.addEventListener("mousemove", onDragMove);
  window.addEventListener("mouseup", onDragEnd);
  vp.addEventListener("wheel", onTreeWheel, { passive: false });
  vp.addEventListener("touchstart", onTouchStart, { passive: true });
  vp.addEventListener("touchmove", onTouchMove, { passive: false });
  vp.addEventListener("touchend", onTouchEnd);
  return { vp, canvas };
}
function updateTreeTransform() {
  const canvas = document.getElementById("treeCanvas");
  if (canvas) canvas.style.transform = `translate(${treePanX}px, ${treePanY}px) scale(${treeZoom})`;
  const lvl = document.getElementById("zoomLevel");
  if (lvl) lvl.textContent = Math.round(treeZoom * 100) + "%";
}
function zoomTree(factor, cx, cy) {
  const vp = document.getElementById("treeViewport");
  if (!vp) return;
  const oldZoom = treeZoom;
  treeZoom = Math.max(0.2, Math.min(3, treeZoom * factor));
  if (cx !== undefined && cy !== undefined) {
    const rect = vp.getBoundingClientRect();
    const px = cx - rect.left;
    const py = cy - rect.top;
    treePanX = px - (px - treePanX) * (treeZoom / oldZoom);
    treePanY = py - (py - treePanY) * (treeZoom / oldZoom);
  }
  updateTreeTransform();
}
function resetTreeView() { treeZoom = 1; treePanX = null; treePanY = 20; fitTreeView(true); }
function onTreeWheel(e) { e.preventDefault(); const factor = e.deltaY < 0 ? 1.1 : 0.9; zoomTree(factor, e.clientX, e.clientY); }
function onDragStart(e) {
  if (e.button !== 0) return;
  isDragging = true; dragMoved = false;
  dragStartX = e.clientX; dragStartY = e.clientY;
  startPanX = treePanX || 0; startPanY = treePanY || 0;
  const vp = document.getElementById("treeViewport");
  if (vp) vp.classList.add("dragging");
}
function onDragMove(e) {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  treePanX = startPanX + dx; treePanY = startPanY + dy;
  updateTreeTransform();
}
function onDragEnd() {
  if (!isDragging) return;
  isDragging = false;
  const vp = document.getElementById("treeViewport");
  if (vp) vp.classList.remove("dragging");
}
let touchStartDist = 0, touchStartZoom = 1;
function onTouchStart(e) {
  if (e.touches.length === 1) {
    isDragging = true; dragMoved = false;
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
    startPanX = treePanX || 0; startPanY = treePanY || 0;
  } else if (e.touches.length === 2) {
    isDragging = false;
    const [a, b] = e.touches;
    touchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    touchStartZoom = treeZoom;
  }
}
function onTouchMove(e) {
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - dragStartX;
    const dy = e.touches[0].clientY - dragStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    treePanX = startPanX + dx; treePanY = startPanY + dy;
    updateTreeTransform();
  } else if (e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (touchStartDist > 0) {
      const factor = dist / touchStartDist;
      const newZoom = Math.max(0.2, Math.min(3, touchStartZoom * factor));
      const cx = (a.clientX + b.clientX) / 2;
      const cy = (a.clientY + b.clientY) / 2;
      const oldZoom = treeZoom;
      treeZoom = newZoom;
      const vp = document.getElementById("treeViewport");
      if (vp) {
        const rect = vp.getBoundingClientRect();
        const px = cx - rect.left; const py = cy - rect.top;
        treePanX = px - (px - treePanX) * (treeZoom / oldZoom);
        treePanY = py - (py - treePanY) * (treeZoom / oldZoom);
      }
      updateTreeTransform();
    }
  }
}
function onTouchEnd() { isDragging = false; }
function fitTreeView(forceReset) {
  const vp = document.getElementById("treeViewport");
  const canvas = document.getElementById("treeCanvas");
  if (!vp || !canvas) return;
  const key = viewMode === "personal" ? "personal_" + currentOwnerId : "full";
  if (key !== treeViewKey || forceReset) {
    treeViewKey = key;
    treeZoom = 1; treePanX = null; treePanY = 20;
  }
  const canvasH = canvas.offsetHeight;
  const canvasW = canvas.offsetWidth;
  const vpH = Math.min(Math.max(canvasH + 20, 400), Math.max(400, window.innerHeight * 0.75));
  vp.style.height = vpH + "px";
  if (treePanX === null) {
    const vpW = vp.clientWidth;
    treePanX = canvasW < vpW ? Math.round((vpW - canvasW) / 2) : 20;
  }
  updateTreeTransform();
}

/* ================== ОБЩАЯ ГАЛЕРЕЯ ================== */
function getSortedPhotos() {
  let arr = [...familyPhotos];
  if (currentPhotoSort === 'date')  arr.sort((a,b) => (a.date||"").localeCompare(b.date||""));
  if (currentPhotoSort === 'event') arr.sort((a,b) => (a.event||"").localeCompare(b.event||""));
  if (currentPhotoSort === 'kind')  arr.sort((a,b) => (a.kind||"Фото").localeCompare(b.kind||"Фото"));
  if (currentPhotoFilter !== 'all') arr = arr.filter(p => (p.kind || "Фото") === currentPhotoFilter);
  return arr;
}
function setPhotoSort(type) { currentPhotoSort = type; syncPhotoButtons(); renderFamilyPhotos(); saveState(); }
function setPhotoFilter(kind) { currentPhotoFilter = kind; syncPhotoButtons(); renderFamilyPhotos(); saveState(); }
function kindBadge(kind) {
  const k = kind || "Фото";
  const icon = k === "Документ" ? "📄" : k === "Медаль" ? "🎖" : k === "Другое" ? "📦" : "📷";
  return `<span class="photo-kind-badge">${icon} ${k}</span>`;
}
function uploadFamilyPhoto() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*";
  input.onchange = function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const kindInput = prompt("Вид материала:\n1 — Фото\n2 — Документ\n3 — Медаль\n4 — Другое", "Фото");
      const map = { "1": "Фото", "2": "Документ", "3": "Медаль", "4": "Другое" };
      const kind = map[(kindInput || "").trim()] || (kindInput || "Фото").trim();
      const date = prompt("Дата материала:", "");
      const event = prompt("Событие / подпись:", "");
      const people = prompt("Кто изображён / о ком:", "");
      familyPhotos.push({ dataUrl: ev.target.result, date: date || "Дата неизвестна", event: event || "", people: people || "", kind: kind || "Фото" });
      renderFamilyPhotos(); saveState();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
function renderFamilyPhotos() {
  const container = document.getElementById("photoGallery");
  if (!container) return;
  container.innerHTML = "";
  const photos = getSortedPhotos();
  if (photos.length === 0) {
    container.innerHTML = `<p class="col-span-full text-center text-gray-500 italic py-8">Ничего не найдено — загрузите фото, документ или медаль в общую галерею. Галереи древ открываются через карточку добавочного человека → «🌳 Открыть древо» → «📸 Галерея древа».</p>`;
    return;
  }
  photos.forEach((photo) => {
    const i = familyPhotos.indexOf(photo);
    const div = document.createElement("div");
    div.className = "photo-card bg-white border border-[#d4b89e] rounded-2xl overflow-hidden";
    div.innerHTML = `
      <img src="${photo.dataUrl}" class="w-full h-56 object-cover cursor-pointer" onclick="openFullPhoto(${i})">
      <div class="p-4">
        ${kindBadge(photo.kind)}
        <p class="text-xs text-gray-500">${photo.date}</p>
        <p class="text-sm font-semibold">${photo.event}</p>
        <p class="text-xs text-gray-600">${photo.people}</p>
        <div class="flex gap-2 mt-4">
          <button onclick="downloadPhoto(${i})" class="flex-1 bg-blue-600 text-white text-xs py-2 rounded-xl">Скачать</button>
          <button onclick="editFamilyPhoto(${i})" class="flex-1 bg-amber-600 text-white text-xs py-2 rounded-xl">Изменить</button>
          <button onclick="deleteFamilyPhoto(${i})" class="flex-1 bg-red-600 text-white text-xs py-2 rounded-xl">Удалить</button>
        </div>
      </div>`;
    container.appendChild(div);
  });
}
function openFullPhoto(i) {
  const photo = familyPhotos[i];
  const win = window.open();
  win.document.write('<img src="' + photo.dataUrl + '" style="max-width:100%; height:auto;">');
}
function downloadPhoto(i) {
  const a = document.createElement("a");
  a.href = familyPhotos[i].dataUrl;
  a.download = (familyPhotos[i].kind || "Фото") + "_" + (familyPhotos[i].date || "дата") + ".jpg";
  a.click();
}
function deleteFamilyPhoto(i) {
  if (confirm("Удалить материал?")) { familyPhotos.splice(i, 1); renderFamilyPhotos(); saveState(); }
}
function editFamilyPhoto(i) {
  const p = familyPhotos[i];
  const kind = prompt("Вид (Фото / Документ / Медаль / Другое):", p.kind || "Фото"); if (kind === null) return;
  const date = prompt("Дата:", p.date || ""); if (date === null) return;
  const event = prompt("Событие / подпись:", p.event || ""); if (event === null) return;
  const people = prompt("Кто изображён / о ком:", p.people || ""); if (people === null) return;
  p.kind = kind.trim() || "Фото"; p.date = date || "Дата неизвестна"; p.event = event; p.people = people;
  renderFamilyPhotos(); saveState();
}

/* ================== ВКЛАДКИ / РОУТИНГ ================== */
function showTab(tabId) {
  document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add("hidden"));
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove("active", "border-b-4", "border-[#8d5524]"));
  const c = document.getElementById("content-" + tabId);
  const t = document.getElementById("tab-" + tabId);
  if (c) c.classList.remove("hidden");
  if (t) t.classList.add("active", "border-b-4", "border-[#8d5524]");
  currentTab = tabId;
  if (tabId === "photos") syncPhotoButtons();
  if (tabId === "main") setTimeout(() => fitTreeView(false), 0);
}

function route() {
  const hash = location.hash.replace('#', '');
  const backBar = document.getElementById("backBar");
  const tabsWrapper = document.getElementById("tabsWrapper");
  const oldGallery = document.getElementById("personalTreeGalleryPage");
  if (oldGallery) oldGallery.remove();

  if (hash.startsWith('tree_')) {
    const id = parseInt(hash.replace('tree_', ''));
    if (getPerson(id) && canHavePersonalTree(getPerson(id))) {
      viewMode = 'personal';
      currentOwnerId = id;
      if (backBar) backBar.classList.remove("hidden");
      if (tabsWrapper) tabsWrapper.classList.add("hidden");
      document.getElementById("mainTitle").textContent = "Древо: " + getPerson(id).name;
      renderPersonalTree(id);
      saveState();
      return;
    }
  }
  viewMode = 'full';
  currentOwnerId = null;
  treeViewKey = '';
  if (backBar) backBar.classList.add("hidden");
  if (tabsWrapper) tabsWrapper.classList.remove("hidden");
  document.getElementById("mainTitle").textContent = "Семейная Летопись";
  document.title = "Семейная Летопись";
  renderTree();
  renderList();
  renderFamilyPhotos();
  syncPhotoButtons();
  const tabToShow = ['main','list','photos'].includes(currentTab) ? currentTab : 'main';
  showTab(tabToShow);
  saveState();
}
window.addEventListener('hashchange', route);

/* ================== ЭКСПОРТ ================== */
function exportTree() {
  saveState();
  let html = document.documentElement.outerHTML;
  try {
    html = html.replace(/let family = \[[\s\S]*?\];/, 'let family = ' + JSON.stringify(family) + ';');
    html = html.replace(/let familyPhotos = \[[\s\S]*?\];/, 'let familyPhotos = ' + JSON.stringify(familyPhotos) + ';');
    html = html.replace(/let personalTreePhotos = \{\};/, 'let personalTreePhotos = ' + JSON.stringify(personalTreePhotos) + ';');
  } catch(e) {}
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Семейная_Летопись.html"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  alert("Дерево сохранено!");
}

/* ================== СИНХРОНИЗАЦИЯ ================== */
window.addEventListener("storage", (e) => {
  if (e.key !== STORAGE_KEY) return;
  loadState();
  route();
});

/* ================== INIT ================== */
(function init() {
  const loaded = loadState();
  migrate();
  if (!loaded) saveState();
  route();
})();
</script>
